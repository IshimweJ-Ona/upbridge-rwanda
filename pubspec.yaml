name: upbridge
description: "UpBridge Rwanda — IT & soft skills, mentorship, portfolio, and opportunities."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  flutter_image_compress: ^2.5.1
  http: ^1.6.0
  path: ^1.9.1
  intl: ^0.20.3
  animations: ^3.0.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  flutter_svg: ^2.4.0
  cached_network_image: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/upbridge_logo.svg
    - assets/images/upbridge_logo_on_dark.svg
    - assets/images/upbridge_icon.svg
    - assets/images/app_icon.png
    - assets/images/splash_mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#13294B"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#13294B"
  image: "assets/images/splash_mark.png"
  android_12:
    color: "#13294B"
    image: "assets/images/splash_mark.png"
  ios: true
  android: true
